<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Camper Compare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E6F6A'/%3E%3Cpath d='M12 40h40v6H12zM16 26h22l8 8v6H16z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#EEF1EE;--panel:#fff;--ink:#17262B;--muted:#5A6A6E;--line:#D3DAD6;--accent:#1E6F6A;--tbc:#A8651A;--tbcbg:#FBF1E4;
  --H:#B23A2E;--RH:#2F5E9E;--RG:#2F7A3A;}
@media (prefers-color-scheme:dark){:root{--bg:#10191C;--panel:#18252A;--ink:#E6ECEA;--muted:#9AAAA7;--line:#2C3C41;--accent:#4FB3AA;--tbc:#E0A052;--tbcbg:#2A2216;
  --H:#E3786C;--RH:#7FA8E0;--RG:#7CC276;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.6rem;margin:6px 0 2px}
h2{font-size:1.15rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;min-height:40px}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.who{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;min-height:36px}
.pill[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.banner{background:var(--tbcbg);border:1px solid var(--tbc);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0}
.setups{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.setup{border-radius:10px;padding:10px;border:1px solid var(--line);border-top:5px solid var(--c)}
.setup b{display:block}
.total{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.total small{font-size:.8rem;font-weight:400;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0}
details.sec>summary{list-style:none;padding:14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.item{border-top:1px solid var(--line);padding:12px 14px}
.ihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.iname{font-weight:600}
.weight{display:flex;gap:4px;align-items:center;font-size:.8rem;color:var(--muted)}
.weight button{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-width:34px;min-height:32px;font-size:.8rem}
.weight button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;padding:8px 0 0;align-items:start}
.lab{font-weight:600;color:var(--c);font-size:.9rem;padding-top:2px}
.fact{font-size:.92rem}
.fact.tbc{background:var(--tbcbg);border-left:3px solid var(--tbc);padding:2px 6px;border-radius:4px}
.scores{grid-column:2;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sc{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:40px;min-height:38px;font-weight:600}
.sc[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}
.others{font-size:.8rem;color:var(--muted);margin-left:6px}
.hint{font-size:.8rem;color:var(--muted)}
.db li{margin-bottom:10px}
.gate[hidden]{display:none}
.gate{position:fixed;inset:0;background:rgba(16,25,28,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.gate .card{max-width:380px;width:100%}
.gate input{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 16px;min-height:44px;width:100%}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.setups{grid-template-columns:1fr}.row{grid-template-columns:1fr}.scores{grid-column:1}.who{margin-left:0}}
</style>
</head>
<body>
<main>
  <h1>Camper Compare</h1>
  <div class="muted small">Hilux vs Hotomobil vs Goatfell. Score each point 0 to 3; weights 1 to 3 are shared.</div>
  <div class="bar">
    <div class="tabs">
      <button class="tab" data-view="summary" aria-pressed="true">Summary</button>
      <button class="tab" data-view="score" aria-pressed="false">Score</button>
    </div>
    <div class="who"><span class="small muted">I am</span>
      <button class="pill" data-me="Ollie">Ollie</button>
      <button class="pill" data-me="Jenny">Jenny</button>
    </div>
  </div>
  <div id="syncBanner"></div>
  <section id="summary"></section>
  <section id="score" hidden></section>
</main>
<div class="gate" id="gate" hidden>
  <div class="card">
    <h2>Family code</h2>
    <p class="small muted">Same code as the recipes app. It keeps your scores in sync between phones.</p>
    <input id="codeIn" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="family code">
    <button class="primary" id="codeGo">Continue</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
